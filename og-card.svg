<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="badge-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="blur" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg-grad)" />

  <!-- Ambient Glow Blobs -->
  <circle cx="200" cy="150" r="180" fill="#10b981" opacity="0.15" filter="url(#glow)" />
  <circle cx="1000" cy="480" r="220" fill="#0ea5e9" opacity="0.12" filter="url(#glow)" />

  <!-- Border Frame -->
  <rect x="24" y="24" width="1152" height="582" rx="28" fill="none" stroke="#334155" stroke-width="1.5" opacity="0.6" />

  <!-- Top Badge -->
  <rect x="80" y="80" width="340" height="42" rx="21" fill="#064e3b" stroke="#10b981" stroke-width="1" opacity="0.8" />
  <circle cx="104" cy="101" r="6" fill="#34d399" />
  <text x="122" y="107" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#a7f3d0" letter-spacing="1">RESEARCHER &amp; SYSTEMS ARCHITECT</text>

  <!-- Main Name -->
  <text x="80" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="58" font-weight="900" fill="#ffffff" letter-spacing="-1">
    I Wayan Aditya Suranata
  </text>

  <!-- Alias & Tag -->
  <text x="80" y="250" font-family="'JetBrains Mono', monospace, monospace" font-size="24" font-weight="700" fill="#38bdf8">
    @iwas108 <tspan fill="#64748b">•</tspan> Nang Adit <tspan fill="#64748b">•</tspan> Narin Laboratory
  </text>

  <!-- Subtitle & Focus -->
  <text x="80" y="315" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="500" fill="#94a3b8">
    Cyber-Physical Agriculture (UDAWA IoT) &amp; AI-Driven Research Platforms (SLR-Magic)
  </text>

  <!-- Philosophy Quote Quote Card -->
  <rect x="80" y="370" width="1040" height="130" rx="20" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
  <rect x="80" y="370" width="8" height="130" rx="4" fill="url(#accent-grad)" />
  <text x="115" y="422" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-style="italic" font-weight="600" fill="#ffffff">
    "Selesai Belajar Mengajarlah, Dengan Demikian Kau Akan Terus Belajar."
  </text>
  <text x="115" y="465" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-style="italic" font-weight="500" fill="#38bdf8">
    "Bersyukur adalah wujud nyata dari 'jangan lupa bahagia'."
  </text>

  <!-- Bottom Badges -->
  <g transform="translate(80, 535)">
    <text x="0" y="24" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="700" fill="#10b981">
      8 Featured Open Source Projects
    </text>
    <text x="400" y="24" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="500" fill="#64748b">
      https://iwas108.github.io
    </text>
  </g>

  <!-- 108 Right Icon Hexagon Badge -->
  <g transform="translate(1000, 110)">
    <rect width="110" height="110" rx="30" fill="url(#badge-grad)" />
    <text x="55" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="46" font-weight="900" fill="#ffffff" text-anchor="middle">108</text>
  </g>
</svg>
